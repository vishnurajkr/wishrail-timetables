name: Collect and publish timetables
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Collection time budget in seconds (0 publishes the verified seed only)
        type: number
        default: 4800
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: shared-timetable-publisher
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_KEY: ${{ secrets.TIMETABLE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install -r requirements.txt
      - name: Restore collector checkpoints and previous release
        shell: bash
        run: |
          test -n "$SIGNING_KEY" || { echo 'Set TIMETABLE_SIGNING_KEY before running the publisher'; exit 1; }
          mkdir -p cache/records incoming previous public
          cp seed-records/*.json cache/records/
          if gh release view collector-state >/dev/null 2>&1; then
            gh release download collector-state -p checkpoint.tar.gz -D incoming
            python - <<'PY'
          import tarfile
          with tarfile.open('incoming/checkpoint.tar.gz') as archive:
              archive.extractall('.', filter='data')
          PY
          fi
          gzip -dc assets/data/wishrail.db.gz > base.db
          if gh release view timetable-latest >/dev/null 2>&1; then
            gh release download timetable-latest -p manifest.json -D previous
            asset=$(python - <<'PY'
          import json,base64,re
          from pathlib import PurePosixPath
          data=json.loads(base64.b64decode(json.load(open('previous/manifest.json'))['payload']))
          name=PurePosixPath(data['url']).name
          assert re.fullmatch(r'[A-Za-z0-9._-]+\.db\.gz',name)
          print(name)
          PY
          )
            gh release download timetable-latest -p "$asset" -D previous
            gzip -dc "previous/$asset" > base.db
          fi
      - name: Collect within budget and prepare a signed release
        env:
          REQUESTED_SECONDS: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.seconds) || '4800' }}
        shell: bash
        run: |
          umask 077
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/timetable-key.pem"
          trap 'rm -f "$RUNNER_TEMP/timetable-key.pem"' EXIT
          release_id="ntes-$(date -u +%Y%m%dT%H%M%SZ)-$GITHUB_RUN_ID"
          python -m tools.timetable_sync.shared_collector --root cache --base base.db \
            --seconds "$REQUESTED_SECONDS" --publish-dir public --release-id "$release_id" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/timetable-latest" \
            --key "$RUNNER_TEMP/timetable-key.pem"
      - name: Report source access and collection progress
        if: always()
        shell: bash
        run: |
          python - <<'PYREPORT'
          import json,os
          from pathlib import Path
          path=Path('cache/report.json')
          if not path.exists():
              print('::warning::No collection report was produced; check earlier steps.')
              raise SystemExit(0)
          report=json.loads(path.read_text())
          status=report.get('status','unknown')
          lines=['## Timetable collection',
              f"Status: **{status}**",
              f"Timetables downloaded this run: {report.get('downloaded',0)}",
              f"Trains discovered: {report.get('discovered',0)}",
              f"Directory complete: {report.get('directory_complete',False)}"]
          for field in ['reason','blocked_until']:
              if report.get(field):lines.append(f"{field}: {report[field]}")
          lines.append('A successful publishing job does not establish complete or current national coverage. Check release metadata.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('\n\n'.join(lines)+'\n')
          if status in ('paused','cooldown'):
              print('::warning::Railway source collection is paused. Previously saved timetable data remains available.')
          PYREPORT
      - name: Publish prepared update
        shell: bash
        run: |
          if test -f public/manifest.json; then
            gh release view timetable-latest >/dev/null 2>&1 || gh release create timetable-latest --title 'WishRail timetables' --notes 'Signed offline timetable updates. Coverage is reported in each release.'
            gh release upload timetable-latest public/*.db.gz public/*.metadata.json --clobber
            gh release upload timetable-latest public/manifest.json --clobber
            python -m tools.timetable_sync.shared_collector --root cache --acknowledge
          fi
      - name: Save checkpoints even after a source outage or publication failure
        if: always()
        shell: bash
        run: |
          if test -f cache/state.json; then
            tar -czf checkpoint.tar.gz cache
            gh release view collector-state >/dev/null 2>&1 || gh release create collector-state --latest=false --title 'Collector checkpoints' --notes 'Resumable public timetable collection state.'
            gh release upload collector-state checkpoint.tar.gz --clobber
          fi
